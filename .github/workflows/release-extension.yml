name: Release RPA Skills Extension

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Package Extension
        # Use vsce to build the VSIX release artifact.
        run: npx --yes @vscode/vsce package -o rpa-skills-extension.vsix

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: packages/vscode-extension/rpa-skills-extension.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Open VSX
        # Publish the extension to open-vsx.org
        run: npx --yes ovsx publish rpa-skills-extension.vsix -p ${{ secrets.OPEN_VSX_TOKEN }}
